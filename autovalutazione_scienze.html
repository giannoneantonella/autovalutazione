<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autovalutazione – L'uomo, i viventi e l'ambiente</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Merriweather+Sans:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --verde:   #2ecc71;
    --giallo:  #f1c40f;
    --arancio: #e67e22;
    --rosso:   #e74c3c;
    --blu:     #2c3e6b;
    --azzurro: #4a9eff;
    --bg:      #f0f4ff;
    --card:    #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 32px 16px 48px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header .etichetta {
    display: inline-block;
    background: var(--blu);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  header h1 {
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 900;
    color: var(--blu);
    line-height: 1.2;
  }

  header p.sub {
    font-family: 'Merriweather Sans', sans-serif;
    font-style: italic;
    color: var(--azzurro);
    margin-top: 6px;
    font-size: 15px;
  }

  /* legenda livelli */
  .legenda {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .legenda-item {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border-radius: 30px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,.07);
  }

  .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* tabella */
  .wrapper {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .riga {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr auto;
  }

  .riga-contenuto {
    padding: 18px 20px;
  }

  .riga-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--azzurro);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .riga-testo {
    font-size: 15px;
    font-weight: 600;
    color: var(--blu);
    line-height: 1.4;
  }

  .livelli {
    display: flex;
    flex-direction: column;
    border-left: 1px solid #e8eaf0;
  }

  .livello-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 18px;
    cursor: pointer;
    background: none;
    border: none;
    border-bottom: 1px solid #e8eaf0;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #888;
    transition: background .18s, color .18s;
    white-space: nowrap;
  }

  .livello-btn:last-child { border-bottom: none; }

  .livello-btn:hover { background: #f5f7ff; }

  .livello-btn.attivo-1 { background: #fde8e8; color: var(--rosso); }
  .livello-btn.attivo-2 { background: #fef3cd; color: #b47a00; }
  .livello-btn.attivo-3 { background: #dff6e8; color: #1a8a4a; }
  .livello-btn.attivo-4 { background: #d0f0ff; color: #0070b0; }

  .livello-btn .emoji { font-size: 16px; }

  /* riepilogo */
  .riepilogo {
    max-width: 820px;
    margin: 28px auto 0;
    background: var(--card);
    border-radius: 18px;
    padding: 24px 24px 28px;
    box-shadow: 0 3px 14px rgba(0,0,0,.09);
  }

  .riepilogo h2 {
    font-size: 16px;
    font-weight: 900;
    color: var(--blu);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .barre {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .barra-riga {
    display: grid;
    grid-template-columns: 110px 1fr 28px;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }

  .barra-label { font-weight: 700; color: #555; }

  .barra-track {
    background: #eef0f5;
    border-radius: 20px;
    height: 12px;
    overflow: hidden;
  }

  .barra-fill {
    height: 100%;
    border-radius: 20px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .barra-count { font-weight: 700; color: #888; text-align: right; }

  .btn-stampa {
    display: block;
    margin: 20px auto 0;
    padding: 11px 32px;
    background: var(--blu);
    color: #fff;
    border: none;
    border-radius: 30px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: background .2s;
  }
  .btn-stampa:hover { background: var(--azzurro); }

  @media (max-width: 540px) {
    .riga { grid-template-columns: 1fr; }
    .livelli { flex-direction: row; border-left: none; border-top: 1px solid #e8eaf0; }
    .livello-btn { border-bottom: none; border-right: 1px solid #e8eaf0; padding: 10px 6px; font-size: 11px; flex-direction: column; gap: 2px; }
    .livello-btn:last-child { border-right: none; }
  }

  @media print {
    body { background: #fff; }
    .btn-stampa { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="etichetta">Autovalutazione</div>
  <h1>Obiettivo di Apprendimento</h1>
  <p class="sub">L'uomo, i viventi e l'ambiente</p>
</header>

<div class="legenda">
  <div class="legenda-item"><div class="dot" style="background:var(--rosso)"></div> Non ancora</div>
  <div class="legenda-item"><div class="dot" style="background:var(--arancio)"></div> In parte</div>
  <div class="legenda-item"><div class="dot" style="background:var(--verde)"></div> Abbastanza</div>
  <div class="legenda-item"><div class="dot" style="background:var(--azzurro)"></div> Sicuro/a</div>
</div>

<div class="wrapper" id="tabella"></div>

<div class="riepilogo">
  <h2>📊 Il mio profilo</h2>
  <div class="barre" id="barre"></div>
  <button class="btn-stampa" onclick="window.print()">🖨️ Stampa / Salva PDF</button>
</div>

<script>
const criteri = [
  { num: "01", testo: "So descrivere il corpo umano come un sistema complesso formato da organi e apparati." },
  { num: "02", testo: "So spiegare come il corpo interagisce con l'ambiente in cui è inserito." },
  { num: "03", testo: "So costruire un modello plausibile del funzionamento di un apparato (es. respiratorio, digerente, circolatorio)." },
  { num: "04", testo: "So confrontare il funzionamento di diversi apparati e individuarne le differenze principali." },
  { num: "05", testo: "So elaborare una rappresentazione intuitiva della struttura cellulare." },
  { num: "06", testo: "Capisco il collegamento tra cellula, tessuto, organo e apparato." },
];

const livelli = [
  { label: "Non ancora", emoji: "😕", cls: "attivo-1" },
  { label: "In parte",   emoji: "🤔", cls: "attivo-2" },
  { label: "Abbastanza", emoji: "🙂", cls: "attivo-3" },
  { label: "Sicuro/a",  emoji: "😎", cls: "attivo-4" },
];

const colori = ["var(--rosso)","var(--arancio)","var(--verde)","var(--azzurro)"];
const nomiLivelli = ["Non ancora","In parte","Abbastanza","Sicuro/a"];

// stato
const selezioni = new Array(criteri.length).fill(null);

function renderTabella() {
  const cont = document.getElementById('tabella');
  cont.innerHTML = '';
  criteri.forEach((c, i) => {
    const riga = document.createElement('div');
    riga.className = 'riga';
    riga.innerHTML = `
      <div class="riga-contenuto">
        <div class="riga-num">Criterio ${c.num}</div>
        <div class="riga-testo">${c.testo}</div>
      </div>
      <div class="livelli" id="liv-${i}">
        ${livelli.map((l,j) => `
          <button class="livello-btn${selezioni[i]===j ? ' '+l.cls : ''}" onclick="seleziona(${i},${j})">
            <span class="emoji">${l.emoji}</span>
            <span>${l.label}</span>
          </button>
        `).join('')}
      </div>
    `;
    cont.appendChild(riga);
  });
  renderBarre();
}

function seleziona(i, j) {
  selezioni[i] = selezioni[i] === j ? null : j;
  renderTabella();
}

function renderBarre() {
  const cont = document.getElementById('barre');
  cont.innerHTML = '';
  const totale = selezioni.filter(s => s !== null).length;
  nomiLivelli.forEach((nome, j) => {
    const conta = selezioni.filter(s => s === j).length;
    const perc = totale ? Math.round(conta / criteri.length * 100) : 0;
    cont.innerHTML += `
      <div class="barra-riga">
        <div class="barra-label">${livelli[j].emoji} ${nome}</div>
        <div class="barra-track">
          <div class="barra-fill" style="width:${perc}%;background:${colori[j]}"></div>
        </div>
        <div class="barra-count">${conta}</div>
      </div>
    `;
  });
}

renderTabella();
</script>
</body>
</html>
